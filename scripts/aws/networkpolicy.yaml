# 앱 네임스페이스 ingress 기본 차단 + 허용 목록 — deploy.sh 가 적용 (egress 는 policyTypes 에 넣지 않아 그대로 열림)
#   치환 값(deploy.sh 문자열 치환): NS = 앱 네임스페이스 · ALB_IP_BLOCKS = SSM alb_subnet_cidrs 를 ipBlock 줄로 펼친 값
#   주석에 달러+중괄호 표기를 쓰지 말 것 — 주석 안도 치환돼 YAML 이 깨짐
#   서비스 간 허용 = 설계서 '동기 호출' 탭 (order → store·member·payment, delivery → member)
#   알려진 한계: ALB 와 파드가 같은 서브넷이라 ALB 대역 허용에 파드 IP 도 포함 → 클러스터 안 파드가 gateway 에는 닿음
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: ${NS} }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# ALB → gateway: 8080 트래픽, 8081 대상 그룹 헬스체크
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-from-alb, namespace: ${NS} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
  policyTypes: [Ingress]
  ingress:
    - from:
${ALB_IP_BLOCKS}
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 8081, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: member-api, namespace: ${NS} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: member } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: order } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: delivery } }
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: store-api, namespace: ${NS} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: store } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: order } }
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: order-api, namespace: ${NS} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: order } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: payment-api, namespace: ${NS} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: payment } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: order } }
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: delivery-api, namespace: ${NS} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: delivery } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      ports:
        - { port: 8080, protocol: TCP }
---
# ai (메뉴 사진 배경 제거, FastAPI) — gateway 만 (route ai-image). 메트릭 8081 은 아래 management 정책
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ai-api, namespace: ${NS} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: ai } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      ports:
        - { port: 8080, protocol: TCP }
---
# 8081 actuator: Prometheus 수집 + smoke-test.sh 의 readiness 확인 (kubectl run 이 붙이는 라벨)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: management, namespace: ${NS} }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
        - podSelector: { matchLabels: { run: smoke-test } }
      ports:
        - { port: 8081, protocol: TCP }
