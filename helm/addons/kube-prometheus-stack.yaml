# =============================================================================
# kube-prometheus-stack (namespace monitoring) — scripts/aws/addons.sh 가 설치
#   디스크 없음(EBS CSI 없음 → PVC 금지): Prometheus·Grafana 모두 emptyDir, 매일 끄기 때 함께 사라짐
#   알람은 기존 CloudWatch → SNS → 메일 → Alertmanager 끔
#   Grafana 는 외부 노출 없음(ClusterIP) — kubectl port-forward 로 접속, admin 비밀번호는 ESO Secret grafana-admin
# =============================================================================
alertmanager:
  enabled: false

# EKS 관리형 컨트롤 플레인은 수집 불가 → 대상 down 방지
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    retention: 1d
    scrapeInterval: 30s
    # storageSpec 없음 → emptyDir
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
    # 이 차트가 아닌 PodMonitor·ServiceMonitor 도 수집
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
  # 앱 6개(app.kubernetes.io/part-of=baedalsak) 의 management(8081) /actuator/prometheus
  #   백엔드가 아직 노출 전이면 대상이 down 으로만 보이고 에러 없음
  additionalPodMonitors:
    - name: baedalsak-apps
      namespaceSelector: { any: true }
      selector:
        matchLabels: { app.kubernetes.io/part-of: baedalsak }
      podTargetLabels: [service]
      podMetricsEndpoints:
        - port: management
          path: /actuator/prometheus
          interval: 30s
          # 공개 Spring Boot·JVM 대시보드가 application 라벨로 서비스를 고름 → 파드 라벨 service 를 복사
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_label_service]
              targetLabel: application

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 64Mi }

grafana:
  persistence: { enabled: false }
  service: { type: ClusterIP }
  ingress: { enabled: false }
  admin:
    existingSecret: grafana-admin   # addons.sh 의 ExternalSecret (Secrets Manager <SECRET_PREFIX>/grafana)
    userKey: admin-user
    passwordKey: admin-password
  # 로그인 없이 Editor(Explore 로 로그·추적 검색) — 외부 노출 없이 EKS 등록자만 port-forward 로 들어옴. 설정·데이터소스는 admin 로그인(인프라)
  grafana.ini:
    auth.anonymous: { enabled: true, org_role: Editor }
    # 첫 화면(Home) = Spring Boot Observability (아래 dashboards 가 내려받은 파일)
    dashboards: { default_home_dashboard_path: /var/lib/grafana/dashboards/baedalsak/spring-boot-observability.json }
  # 익명 Editor 라 클러스터 안 다른 파드(prod 앱 등)는 막음 — monitoring namespace 만 허용. port-forward 는 kubelet 경유라 영향 없음
  networkPolicy:
    enabled: true
    allowExternal: false
    explicitNamespacesSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
  resources:
    requests: { cpu: 50m, memory: 250Mi }
    limits: { memory: 1Gi }   # 384Mi 에서 대시보드 조회 중 OOMKilled (10-29), 평소 약 240Mi — 최고치 잰 뒤 줄임
  # 권한은 Pod Identity <NAME>-grafana (CloudWatchReadOnlyAccess) — terraform/ephemeral/iam.tf
  serviceAccount: { name: grafana }
  # Alertmanager 는 설치 안 함(알람은 CloudWatch → SNS) → 차트가 자동으로 만드는 Alertmanager 데이터 소스 끔
  sidecar:
    datasources:
      alertmanager: { enabled: false }
  # 공개 대시보드 (grafana.com ID) — 파드 시작 때 내려받음, 폴더 "배달싹"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - { name: baedalsak, folder: 배달싹, type: file, disableDeletion: true, options: { path: /var/lib/grafana/dashboards/baedalsak } }
  dashboards:
    baedalsak:
      jvm-micrometer: { gnetId: 4701, revision: 10, datasource: Prometheus }
      spring-boot-observability:
        gnetId: 17175
        revision: 2
        datasource: [{ name: DS_PROMETHEUS, value: Prometheus }, { name: DS_LOKI, value: Loki }]
      spring-boot-3x-statistics: { gnetId: 19004, revision: 1, datasource: Prometheus }
  # 앱 로그는 Loki, 추적은 Tempo, AWS 서비스 로그(Lambda·Step Functions 등)·지표(RDS·MQ 등)는 CloudWatch
  additionalDataSources:
    # 로그 ↔ 추적 연결: 로그 JSON 의 "traceId" → Tempo 추적 열기 / 추적의 span → 그 서비스 Loki 로그 ($$ = provisioning 변수 치환 막음)
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100   # helm/addons/loki.yaml (gateway 없음)
      jsonData:
        derivedFields:
          - name: traceId
            matcherRegex: '"traceId":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200  # helm/addons/tempo.yaml
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          tags: [{ key: service.name, value: service }]   # OTel service.name → Loki 라벨 service
          filterByTraceID: true
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
    - name: CloudWatch
      type: cloudwatch
      jsonData:
        authType: default              # SDK 기본 자격 증명 = Pod Identity
        defaultRegion: $AWS_REGION     # Grafana 가 프로비저닝 때 환경 변수로 치환 (addons.sh grafana.env.AWS_REGION)
