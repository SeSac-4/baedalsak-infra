# =============================================================================
# kube-prometheus-stack (namespace monitoring) — scripts/aws/addons.sh 가 설치
#   디스크 없음(EBS CSI 없음 → PVC 금지): Prometheus·Grafana 모두 emptyDir, 매일 끄기 때 함께 사라짐
#   알람은 기존 CloudWatch → SNS → 메일 → Alertmanager 끔
#   Grafana 는 외부 노출 없음(ClusterIP) — kubectl port-forward 로 접속, admin 비밀번호는 ESO Secret grafana-admin
# =============================================================================
alertmanager:
  enabled: false

# EKS 관리형 컨트롤 플레인은 수집 불가 → 대상 down 방지
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    retention: 1d
    scrapeInterval: 30s
    # storageSpec 없음 → emptyDir
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
    # 이 차트가 아닌 PodMonitor·ServiceMonitor 도 수집
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
  # 앱 6개(app.kubernetes.io/part-of=baedalsak) 의 management(8081) /actuator/prometheus
  #   백엔드가 아직 노출 전이면 대상이 down 으로만 보이고 에러 없음
  additionalPodMonitors:
    - name: baedalsak-apps
      namespaceSelector: { any: true }
      selector:
        matchLabels: { app.kubernetes.io/part-of: baedalsak }
      podTargetLabels: [service]
      podMetricsEndpoints:
        - port: management
          path: /actuator/prometheus
          interval: 30s
          # 공개 Spring Boot·JVM 대시보드가 application 라벨로 서비스를 고름 → 파드 라벨 service 를 복사
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_label_service]
              targetLabel: application

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 64Mi }

grafana:
  persistence: { enabled: false }
  service: { type: ClusterIP }
  ingress: { enabled: false }
  admin:
    existingSecret: grafana-admin   # addons.sh 의 ExternalSecret (Secrets Manager <SECRET_PREFIX>/grafana)
    userKey: admin-user
    passwordKey: admin-password
  # 로그인 없이 Editor(Explore 로 로그·추적 검색) — 외부 노출 없이 EKS 등록자만 port-forward 로 들어옴. 설정·데이터소스는 admin 로그인(인프라)
  grafana.ini:
    auth.anonymous: { enabled: true, org_role: Editor }
    # 알림 메일 · 공유 링크의 주소. localhost 는 Windows 에서 IPv6(::1)로 먼저 가 WSL port-forward 에 안 닿을 때가 있어 127.0.0.1
    server: { root_url: "http://127.0.0.1:3000" }
    # 첫 화면(Home) = Spring Boot Observability (아래 dashboards 가 내려받은 파일)
    dashboards: { default_home_dashboard_path: /var/lib/grafana/dashboards/baedalsak/spring-boot-observability.json }
  # 익명 Editor 라 클러스터 안 다른 파드(prod 앱 등)는 막음 — monitoring namespace 만 허용. port-forward 는 kubelet 경유라 영향 없음
  networkPolicy:
    enabled: true
    allowExternal: false
    explicitNamespacesSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
  resources:
    requests: { cpu: 50m, memory: 250Mi }
    limits: { memory: 600Mi } # 10-30 실측: 평소 약 225Mi · 대시보드 조회 최고 524Mi (384Mi 일 땐 OOMKilled) — 또 죽으면 올림
  # 권한은 Pod Identity <NAME>-grafana (CloudWatchReadOnlyAccess) — terraform/ephemeral/iam.tf
  serviceAccount: { name: grafana }
  # Alertmanager 는 설치 안 함(알람은 CloudWatch → SNS) → 차트가 자동으로 만드는 Alertmanager 데이터 소스 끔
  sidecar:
    datasources:
      alertmanager: { enabled: false }
  # 공개 대시보드 (grafana.com ID) — 파드 시작 때 내려받음, 폴더 "배달싹"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - { name: baedalsak, folder: 배달싹, type: file, disableDeletion: true, options: { path: /var/lib/grafana/dashboards/baedalsak } }
  dashboards:
    baedalsak:
      jvm-micrometer: { gnetId: 4701, revision: 10, datasource: Prometheus }
      spring-boot-observability:
        gnetId: 17175
        revision: 2
        datasource: [{ name: DS_PROMETHEUS, value: Prometheus }, { name: DS_LOKI, value: Loki }]
      spring-boot-3x-statistics: { gnetId: 19004, revision: 1, datasource: Prometheus }
  # 비용 추정 알림 (대시보드 helm/addons/dashboards/baedalsak-cost.json 과 같은 식) → SNS 알림 주제 → 메일
  #   Budgets 메일(실제 청구, 몇 시간 늦음)보다 빠른 추정 알림. SNS 메일 제목은 ASCII 만 · 이 블록엔 $ 금지(provisioning 이 환경 변수로 치환)
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: sns-alerts
          receivers:
            - uid: sns-alerts
              type: sns
              settings:
                topic_arn: "${ALERTS_TOPIC_ARN}"   # addons.sh grafana.env (SSM alerts_topic_arn) — Grafana 가 provisioning 때 치환
                sigv4:
                  region: "${AWS_REGION}"
                # SNS 메일 제목은 ASCII 만 (한글이면 발송 실패) · 본문은 아래 templates.yaml
                subject: '{{`[baedalsak-prod] {{ if eq .Status "firing" }}ALERT{{ else }}RESOLVED{{ end }} - {{ len .Alerts }} alert(s)`}}'
                message: '{{`{{ template "baedalsak.sns.message" . }}`}}'
    # 메일 본문 (SNS 는 텍스트 메일). 차트가 이 값을 helm tpl 로 한 번 더 처리 → {{` … `}} 로 감싸 그대로 넘김
    #   provisioning 이 $이름 을 환경 변수로 치환하므로 Go 템플릿 변수($x)를 쓰지 않음
    templates.yaml:
      apiVersion: 1
      templates:
        - orgId: 1
          name: baedalsak-sns
          template: |
            {{`{{ define "baedalsak.sns.message" }}
            {{- if eq .Status "firing" }}[알림 발생] 배달싹 prod — {{ len .Alerts.Firing }}건{{ else }}[해결됨] 배달싹 prod — {{ len .Alerts.Resolved }}건{{ end }}
            ==================================================
            {{ range .Alerts }}
            ■ {{ .Labels.alertname }}{{ if .Labels.service }}  ({{ .Labels.service }}){{ end }}
              상태 : {{ if eq .Status "firing" }}발생{{ else }}해결{{ end }}
              내용 : {{ .Annotations.summary }}
              값   : {{ with .Values.A }}{{ printf "%.2f" . }}{{ else }}-{{ end }}
            {{- if .Values.H }}
              항목별 시간당 (추정 · 달러, 대시보드 '항목별 시간당' 과 같은 값)
                · EC2 노드 (t3.large × {{ printf "%.0f" .Values.N }}대) : {{ printf "%.3f" .Values.E }}
                · Amazon MQ : 0.197
                · NAT · 디스크 (EC2 기타) : 0.104
                · EKS 컨트롤 플레인 : 0.100
                · CloudWatch : 0.048
                · RDS : 0.028
                · ALB : 0.024
                · ElastiCache : 0.018
                · Secrets Manager : 0.013
                · 공인 IPv4 : 0.010
                · bastion : 0.0065
                · S3 · ECR · CloudTrail · 기타 : 0.003
                = 합계 : {{ printf "%.3f" .Values.H }} /시간
            {{- end }}
              시각 : {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04" }} (KST)
              규칙 : {{ .GeneratorURL }}
              잠시 끄기 : {{ .SilenceURL }}
            --------------------------------------------------
            {{ end }}
            ▶ 비용 대시보드 : http://127.0.0.1:3000/d/baedalsak-cost
            ▶ 로그 (Loki)  : http://127.0.0.1:3000/explore
            ※ 링크는 내 PC 에서 port-forward 를 켜 둔 동안만 열림:
              kubectl -n monitoring port-forward svc/monitoring-grafana 3000:80
            {{ end }}`}}
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: sns-alerts
          group_by: [alertname]
          repeat_interval: 4h
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: cost
          folder: 배달싹
          interval: 5m
          rules:
            - uid: cost-forecast-10
              title: 오늘 예상 비용 10달러 초과
              condition: C
              for: 0m
              noDataState: OK
              execErrState: OK
              annotations: { summary: "오늘 18:00 까지 예상 비용이 10달러 를 넘음 (추정, Grafana 배달싹 비용 대시보드)" }
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model: { refId: A, instant: true, expr: 'sum_over_time((0.5515 + 0.104 * count(kube_node_info))[24h:1m]) / 60 + (0.5515 + 0.104 * count(kube_node_info)) * clamp_min(9 - (hour() + minute() / 60), 0)' }
                # 메일 본문 항목별 시간당 (templates.yaml) — H 합계 · E EC2 노드 · N 노드 수
                - &cost_h { refId: H, relativeTimeRange: { from: 600, to: 0 }, datasourceUid: prometheus, model: { refId: H, instant: true, expr: '0.5515 + 0.104 * count(kube_node_info)' } }
                - &cost_e { refId: E, relativeTimeRange: { from: 600, to: 0 }, datasourceUid: prometheus, model: { refId: E, instant: true, expr: '0.104 * count(kube_node_info)' } }
                - &cost_n { refId: "N", relativeTimeRange: { from: 600, to: 0 }, datasourceUid: prometheus, model: { refId: "N", instant: true, expr: 'count(kube_node_info)' } }
                - refId: C
                  datasourceUid: __expr__
                  model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [10] } }] }
            - uid: cost-forecast-20
              title: 오늘 예상 비용 20달러 초과
              condition: C
              for: 0m
              noDataState: OK
              execErrState: OK
              annotations: { summary: "오늘 18:00 까지 예상 비용이 20달러 를 넘음 (추정)" }
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model: { refId: A, instant: true, expr: 'sum_over_time((0.5515 + 0.104 * count(kube_node_info))[24h:1m]) / 60 + (0.5515 + 0.104 * count(kube_node_info)) * clamp_min(9 - (hour() + minute() / 60), 0)' }
                - *cost_h
                - *cost_e
                - *cost_n
                - refId: C
                  datasourceUid: __expr__
                  model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [20] } }] }
            - uid: cost-hourly-1_5
              title: 시간당 비용 1.5달러 초과
              condition: C
              for: 0m
              noDataState: OK
              execErrState: OK
              annotations: { summary: "지금 시간당 비용이 1.5달러 를 넘음 — 노드 증설 · 부하 테스트 확인 (추정)" }
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model: { refId: A, instant: true, expr: '(0.5515 + 0.104 * count(kube_node_info))' }
                - *cost_h
                - *cost_e
                - *cost_n
                - refId: C
                  datasourceUid: __expr__
                  model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [1.5] } }] }
        # 앱 로그 (Loki) — 서비스별로 따로 알림 (메일 제목에 서비스 이름)
        - orgId: 1
          name: app-logs
          folder: 배달싹
          interval: 1m
          rules:
            - uid: app-error-logs
              title: 앱 ERROR 로그 급증
              condition: C
              for: 0m
              noDataState: OK
              execErrState: OK
              annotations: { summary: "5분 동안 ERROR 로그 10건 이상 — Grafana Explore Loki 로 그 서비스 확인" }
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: loki
                  model: { refId: A, queryType: instant, expr: 'sum by (service) (count_over_time({namespace="prod", level="ERROR"}[5m]))' }
                - refId: C
                  datasourceUid: __expr__
                  model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [9] } }] }
            - uid: app-mq-listener-failed
              title: MQ 메시지 처리 실패 (DLQ 가능)
              condition: C
              for: 0m
              noDataState: OK
              execErrState: OK
              annotations: { summary: "MQ 리스너가 메시지 처리에 실패 — 재시도가 다 실패하면 DLQ 로 감. MQ 콘솔 Queues 의 .dlq 확인 (docs 결제메일_테스트 5절)" }
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: loki
                  model: { refId: A, queryType: instant, expr: 'sum by (service) (count_over_time({namespace="prod"} |~ "(?i)listener failed|PermanentMailFailure" [5m]))' }
                - refId: C
                  datasourceUid: __expr__
                  model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
  # 앱 로그는 Loki, 추적은 Tempo, AWS 서비스 로그(Lambda·Step Functions 등)·지표(RDS·MQ 등)는 CloudWatch
  additionalDataSources:
    # 로그 ↔ 추적 연결: 로그 JSON 의 "traceId" → Tempo 추적 열기 / 추적의 span → 그 서비스 Loki 로그 ($$ = provisioning 변수 치환 막음)
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100   # helm/addons/loki.yaml (gateway 없음)
      jsonData:
        derivedFields:
          - name: traceId
            matcherRegex: '"traceId":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200  # helm/addons/tempo.yaml
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          tags: [{ key: service.name, value: service }]   # OTel service.name → Loki 라벨 service
          filterByTraceID: true
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
    - name: CloudWatch
      uid: cloudwatch
      type: cloudwatch
      jsonData:
        authType: default              # SDK 기본 자격 증명 = Pod Identity
        defaultRegion: $AWS_REGION     # Grafana 가 프로비저닝 때 환경 변수로 치환 (addons.sh grafana.env.AWS_REGION)
