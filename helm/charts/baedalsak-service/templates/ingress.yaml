{{- if .Values.ingress.enabled }}
{{- $ann := deepCopy (.Values.ingress.annotations | default dict) }}
{{- if and .Values.ingress.stripPrefix.enabled .Values.ingress.stripPrefix.traefik }}
{{- /* 순서대로 실행: /api 제거 → X-Forwarded-Prefix 제거 */}}
{{- $mws := list (include "svc.stripMiddlewareName" .) (include "svc.prefixHeaderMiddlewareName" .) }}
{{- $refs := list }}
{{- range $mws }}{{ $refs = append $refs (printf "%s-%s@kubernetescrd" $.Release.Namespace .) }}{{ end }}
{{- $_ := set $ann "traefik.ingress.kubernetes.io/router.middlewares" (join "," $refs) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "svc.name" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className 값이 필요합니다" .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "svc.name" . }}
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
