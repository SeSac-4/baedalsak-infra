{{- /* 운영: Secrets Manager <keyPrefix>/<서비스> 의 JSON 키를 같은 이름으로 Secret 에 담음 */}}
{{- if and .Values.global.externalSecret.enabled (include "svc.needsSecret" .) }}
{{- $e := .Values.global.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "svc.name" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "global.externalSecret.store 값이 필요합니다" $e.store }}
  target:
    name: {{ include "svc.name" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" (required "global.externalSecret.keyPrefix 값이 필요합니다" $e.keyPrefix) (include "svc.name" .) }}
  {{- if or .Values.externalSecretFrom .Values.externalSecretSsm }}
  data:
    {{- range $k, $name := .Values.externalSecretFrom }}{{/* 다른 시크릿의 키 (예 member SEED_PASSWORD ← <keyPrefix>/seed) */}}
    - secretKey: {{ $k }}
      remoteRef: { key: {{ printf "%s/%s" $e.keyPrefix $name }}, property: {{ $k }} }
    {{- end }}
    {{- range $k, $name := .Values.externalSecretSsm }}{{/* SSM 파라미터 (예 COGNITO_USER_POOL_ID ← <ssmPrefix>/cognito_user_pool_id) */}}
    - secretKey: {{ $k }}
      sourceRef: { storeRef: { kind: ClusterSecretStore, name: {{ required "global.externalSecret.ssmStore 값이 필요합니다" $e.ssmStore }} } }
      remoteRef: { key: {{ printf "%s/%s" (required "global.externalSecret.ssmPrefix 값이 필요합니다" $e.ssmPrefix) $name }} }
    {{- end }}
  {{- end }}
{{- end }}
