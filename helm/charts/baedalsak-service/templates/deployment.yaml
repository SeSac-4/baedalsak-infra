{{- $secret := "" }}
{{- if include "svc.needsSecret" . }}{{ $secret = include "svc.secretName" . }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "svc.name" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.autoscaling.minReplicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0          # 새 파드가 Ready 된 뒤에 기존 파드 종료
  selector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "svc.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "svc.name" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "svc.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "svc.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.managementPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "svc.name" . }}
          {{- if include "svc.needsSecret" . }}
          # 비밀번호는 Secret 에서 필요한 키만 주입
          env:
            {{- if .Values.db.enabled }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: DB_PASSWORD } }
            {{- end }}
            {{- if .Values.rabbitmq.enabled }}
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: RABBITMQ_PASSWORD } }
            {{- end }}
            {{- if .Values.redisSession.enabled }}
            - name: REDIS_SESSION_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: REDIS_SESSION_PASSWORD } }
            {{- end }}
            {{- range .Values.secretKeys }}
            - name: {{ . }}
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: {{ . }} } }
            {{- end }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
