{{- if .Values.serviceAccount.create }}
{{- $roleArn := include "svc.roleArn" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "svc.name" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  {{- if or $roleArn .Values.serviceAccount.annotations }}
  annotations:
    {{- with $roleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
