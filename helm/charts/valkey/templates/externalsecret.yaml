apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "valkey.name" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.store }}
  target:
    name: {{ include "valkey.name" . }}
    creationPolicy: Owner
  data:
    - secretKey: REDIS_CACHE_PASSWORD
      remoteRef:
        key: {{ required "externalSecret.key 값이 필요합니다 (<SECRET_PREFIX>/valkey-cache)" .Values.externalSecret.key }}
        property: REDIS_CACHE_PASSWORD
