# delivery — AWS 에서만 쓰는 값 (Argo CD valueFiles: services/<서비스>.yaml → aws.yaml → 이 폴더 → aws-image.yaml)
#   이전에는 scripts/aws/deploy.sh 의 --set

# HPA 1~2 (CPU 70%) — 최대 파드는 CPU 가 아니라 RDS 연결 한도로 정함 (아래 연결 풀과 함께 바꿀 것)
#   services/<서비스>.yaml 의 2~6 · 60~70% 는 부하 테스트 이후 값이라 여기서 모두 덮어씀
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # gateway 와 같음 (11-13 180 → 60)

# DB 연결 풀 4 (기본 10) — RDS 앱 한도 76 (t4g.micro max_connections 79 − 관리자 예약 3)
#   최악 = DB 서비스 5 × (최대 파드 2 + 배포 maxSurge 1) × 풀 4 = 60 < 76  (풀 5 면 75 로 한도에 붙음)
#   필요량 ≈ 최고 TPS × 쿼리 평균 시간(초) = 50 × 0.05 ≈ 2.5 → 파드 1개일 때 4 (1.6배 여유)
#   부족하면 hikaricp_connections_pending · "Connection is not available" 로그 → 그 서비스만 조정
#   values 파일끼리는 null 로 키를 지울 수 없어(helm) aws.yaml 이 아니라 서비스별로 둠 — gateway 는 DB 를 쓰지 않아 없음
extraEnv:
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  REDIS_CACHE_HOST: valkey-cache
  REDIS_CACHE_PORT: "6379"
  SPRING_DATA_REDIS_DATABASE: "0"    # Valkey DB 번호 — 서비스별 배정표는 helm/charts/valkey/values.yaml
  SPRING_DATA_REDIS_SSL_ENABLED: "false"

# 캐시 Valkey (helm/charts/valkey, Service valkey-cache) — ElastiCache(세션 · 토큰)와 별개
#   클러스터 안이라 TLS 없음 → aws.yaml 의 SPRING_DATA_REDIS_SSL_ENABLED=true(ElastiCache 용)를 이 서비스만 끔
#   비밀번호는 Secrets Manager <SECRET_PREFIX>/valkey-cache 에서 (Valkey 파드와 같은 값)
#   키는 DB 0 에만 씀 — 다른 서비스는 다른 DB 번호를 써서 키가 섞이지 않음
#   카카오 REST 키는 <SECRET_PREFIX>/kakao (값은 콘솔 · CLI 로 넣음, Terraform 은 CHANGE_ME 로만 만듦)
secretKeys:
  - REDIS_CACHE_PASSWORD
  - KAKAO_REST_API_KEY
externalSecretFrom:
  REDIS_CACHE_PASSWORD: valkey-cache
  KAKAO_REST_API_KEY: kakao
