# delivery
db:
  enabled: true
  user: delivery_svc
  schema: delivery
dynamodb:
  enabled: false               # DynamoDB 사용이 정해지면 true

autoscaling:                   # AWS 기준 (로컬은 values/local.yaml 에서 1~3)
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

routes:
  MEMBER_SERVICE_URL: http://member:8080

extraEnv:
  # 개발용 seed (server delivery/src/main/resources/db/seed/R__*.sql — 아직 없음, 생기면 자동 적용)
  #   기본값(db/migration)을 덮어쓰므로 migration 도 같이 적는다. 실제 운영 전환 시 이 값 제거
  SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
