# order
db:
  enabled: true
  user: order_svc
  schema: orders
dynamodb:
  enabled: false               # DynamoDB 사용이 정해지면 true

autoscaling:                   # AWS 기준 (로컬은 values/local.yaml 에서 1~3)
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

routes:
  STORE_SERVICE_URL: http://store:8080
  MEMBER_SERVICE_URL: http://member:8080
  PAYMENT_SERVICE_URL: http://payment:8080   # [내부] 결제 요청 · 승인 · 상태 조회 · 만료 (사가 조정자)