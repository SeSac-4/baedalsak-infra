# payment
db:
  enabled: true
  user: payment_svc
  schema: payment
dynamodb:
  enabled: false               # DynamoDB 사용이 정해지면 true

autoscaling:                   # AWS 기준 (로컬은 values/local.yaml 에서 1~3)
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

secretKeys:                    # 비밀값 (make secret 이 .env 에서 넣음 / 운영 Secrets Manager)
  - TOSS_SECRET_KEY                 # 토스페이먼츠 시크릿 키 (결제 승인)
