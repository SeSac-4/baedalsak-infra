# gateway — 외부 진입점 (Ingress /api → gateway). 내부 서비스는 Service DNS 로 라우팅
# DB 계정이 없어 DB 는 사용 안 함 (compose 도 DB_USER 없음)
redisSession:
  enabled: true                # 세션·토큰 관리 (규칙 문서 5번: gateway·member)

routes:                        # compose 와 같은 주소
  STORE_SERVICE_URL: http://store:8080
  ORDER_SERVICE_URL: http://order:8080
  PAYMENT_SERVICE_URL: http://payment:8080
  DELIVERY_SERVICE_URL: http://delivery:8080
  MEMBER_SERVICE_URL: http://member:8080

autoscaling:                   # AWS 기준 (로컬은 values/local.yaml 에서 1~3)
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: true
  stripPrefix:
    enabled: true              # /api 를 떼고 전달 (/api/v1/orders → /v1/orders)

secretKeys:                    # 비밀값 (make secret 이 .env 에서 넣음 / 운영 Secrets Manager)
  - JWT_SECRET                 # 토큰 서명 키 (gateway 검증·member 발급)
