# =============================================================================
# AWS (EKS, namespace = ENV_NAME)
#   "" 로 둔 환경별 값은 켜기 때 scripts/aws/deploy.sh 가 환경변수·SSM 값으로 ApplicationSet(helm/argocd/applicationset.yaml)에 채움
#     (레포가 PUBLIC 이라 계정 번호가 들어가거나 매일 바뀌는 값은 Git 에 두지 않음)
#   적용 순서(Argo CD): 차트 기본값 → services/<서비스>.yaml → aws.yaml → aws-services/<서비스>.yaml → aws-image.yaml → ApplicationSet valuesObject
# =============================================================================
global:
  imageRegistry: ""                 # --set: <ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com
  imageNamespace: ""                # --set: <PROJECT>-<ENV_NAME> (ECR 저장소 <PROJECT>-<ENV_NAME>/<서비스>)
  imagePullSecrets: []

  springProfile: ""                 # 운영 프로필 이름 미정 → 기본(application.yml)

  db:
    host: ""                        # --set: RDS 주소
    port: 5432
  rabbitmq:
    host: ""                        # --set: Amazon MQ 주소
    port: 5671                      # Amazon MQ 는 AMQPS(TLS) 5671 만 받음
    vhost: ""                       # --set: /<ENV_NAME>
    sslEnabled: true
  redisSession:
    host: ""                        # --set: ElastiCache 주소
    port: 6379                      # TLS + AUTH (아래 extraEnv 로 SSL 활성화)
  dynamodb:
    endpoint: ""
  awsRegion: ""                     # --set: AWS_REGION
  awsLocalCredentials: false        # 운영 권한은 Pod Identity

  externalSecret:                   # Secrets Manager <SECRET_PREFIX>/<서비스> → Secret (External Secrets Operator)
    enabled: true
    store: aws-secrets-manager      # scripts/aws/addons.sh 가 만드는 ClusterSecretStore
    keyPrefix: ""                   # --set: SECRET_PREFIX (기본 <PROJECT>/<ENV_NAME>)

  irsaRoleArnFormat: ""             # IRSA 미사용 (Pod Identity — 역할 연결은 Terraform)

# ElastiCache 전송 중 암호화(TLS) — 앱 설정 변경 없이 Spring 표준 속성으로 켬
extraEnv:
  SPRING_DATA_REDIS_SSL_ENABLED: "true"
  # 추적 전송 주소 (helm/addons/tempo.yaml)
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo.monitoring.svc.cluster.local:4318/v1/traces
  # DB 연결 풀(Hikari 4)은 DB 쓰는 5개만 — aws-services/<서비스>.yaml (gateway 제외)

# [임시값 — 결정 예정] 리소스: CPU limit 없음 (JVM 기동 시 CPU 제한 → readiness 실패 방지), 메모리 requests = limits
#   팀 결정 - limit 1 코어. AWS 에서 검증한 값으로 우선 운영하고 확정 후 변경
resources:
  requests: { cpu: 250m, memory: 768Mi } # 부하 테스트 전 100m → 250m (11-13) — HPA % = 사용량 ÷ requests, 100m 이면 JVM 기동(400m+)만으로 확장. 실측 후 조정
  limits:
    cpu: null
    memory: 768Mi

# [임시값 — 결정 예정] 종료 순서: preStop 20s → SIGTERM → graceful 20s → 여유
#   팀 결정은 preStop 10s · grace 45. ALB 대상 제외(헬스체크 10s×2·deregistration 30s)가 10s 보다 길어 AWS 검증값 사용
terminationGracePeriodSeconds: 60
preStopSleepSeconds: 20

# replica·HPA·PDB: 기본은 1 고정(아래) — gateway 는 aws-services/gateway.yaml 에서 HPA 2~4·PDB,
#   DB 쓰는 5개는 aws-services/<서비스>.yaml 에서 HPA 1~2 (연결 풀 4 와 함께)
autoscaling:
  enabled: false
  minReplicas: 1
pdb:
  enabled: false

ingress:
  enabled: false                    # AWS 는 Ingress 대신 TargetGroupBinding

probes:
  startup:
    # [임시값 — 결정 예정] 팀 결정은 ×30(최대 150s). 노드 2대에 서비스 6개 동시 기동 대비 AWS 검증값 사용
    failureThreshold: 60            # 5s × 60 = 최대 300s (기동 시간 측정 후 조정)
