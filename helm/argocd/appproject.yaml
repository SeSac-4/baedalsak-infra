# =============================================================================
# 앱 6개 전용 AppProject — scripts/aws/deploy.sh 가 "__이름__" 을 채워 ApplicationSet 보다 먼저 적용
#   default 프로젝트는 모든 레포 · 네임스페이스 · 클러스터 리소스를 허용함 → 레포가 PUBLIC 이고 develop 보호 규칙이 없어
#   잘못된 커밋이 다른 네임스페이스(kube-system 등)나 클러스터 리소스를 바꾸지 못하게 범위를 좁힘
#   허용 kind = 공통 차트(helm/charts/baedalsak-service)가 AWS 에서 만드는 리소스. 차트에 kind 를 추가하면 여기도 추가
#   (빠지면 sync 가 "not permitted in project" 로 실패해 바로 드러남)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: baedalsak
  namespace: argocd
spec:
  description: 배달싹 앱 6개 (gateway · member · store · order · payment · delivery)
  sourceRepos:
    - "__REPO_URL__"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "__NAMESPACE__"
  # 클러스터 범위 리소스(Namespace · ClusterRole · CRD 등)는 만들지 않음 — 네임스페이스·NetworkPolicy 는 deploy.sh 가 적용
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: "", kind: ConfigMap }
    - { group: "", kind: Service }
    - { group: "", kind: ServiceAccount }
    - { group: apps, kind: Deployment }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
    - { group: policy, kind: PodDisruptionBudget }
    - { group: external-secrets.io, kind: ExternalSecret }
    - { group: elbv2.k8s.aws, kind: TargetGroupBinding }
