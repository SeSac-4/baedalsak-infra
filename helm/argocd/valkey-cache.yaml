# =============================================================================
# 캐시 Valkey (지금은 delivery) — Application 1개. scripts/aws/deploy.sh 가 __이름__ 을 채워 ApplicationSet 보다 먼저 적용
#   앱 6개와 차트가 달라(helm/charts/valkey) ApplicationSet 에 넣지 않음. 프로젝트 · 동기화 정책은 앱과 같음
#   이미지 = ECR <IMAGE_NAMESPACE>/valkey:<차트 values 의 태그> (.github/workflows/images-valkey.yml 이 올림)
#   비밀번호 = Secrets Manager <SECRET_PREFIX>/valkey-cache (쓰는 서비스와 같은 시크릿)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey-cache
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: baedalsak
  source:
    repoURL: "__REPO_URL__"
    targetRevision: "__REVISION__"
    path: helm/charts/valkey
    helm:
      releaseName: valkey-cache   # = Service 이름 (쓰는 서비스의 REDIS_CACHE_HOST) — 바꾸면 접속이 끊김
      valuesObject:
        image:
          registry: "__IMAGE_REGISTRY__"
          namespace: "__IMAGE_NAMESPACE__"
        externalSecret:
          key: "__SECRET_PREFIX__/valkey-cache"
  destination:
    server: https://kubernetes.default.svc
    namespace: "__NAMESPACE__"
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
