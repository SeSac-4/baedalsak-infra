# =============================================================================
# 앱 6개 = Application 6개 (list generator) — scripts/aws/deploy.sh 가 __이름__ 을 채워 kubectl apply
#   __이름__: 레포가 PUBLIC 이라 Git 에 둘 수 없는 값(계정 번호 포함·매일 바뀜) → 켜기 때 SSM·환경변수에서 읽음
#   Application 이름 = 서비스 이름 = helm 릴리스 이름 (차트가 릴리스 이름으로 Service DNS·라벨을 만듦 → 바꾸면 서비스 간 호출이 깨짐)
#   동기화: 자동 sync · prune 켬 · selfHeal 끔 (부하 테스트 중 kubectl 조정 허용 — 부하 테스트가 끝나면 켬) · 실패 시 재시도
#   프로젝트: baedalsak (helm/argocd/appproject.yaml — 이 레포 · prod · 차트가 만드는 kind 만 허용)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: baedalsak
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { svc: member }
          - { svc: store }
          - { svc: order }
          - { svc: payment }
          - { svc: delivery }
          - { svc: gateway }
  template:
    metadata:
      name: '{{.svc}}'
      finalizers:
        # Application 을 지우면 앱 리소스(TGB 포함)도 함께 삭제 — scripts/aws/down.sh 가 LBC 보다 먼저 지움
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: baedalsak
      source:
        repoURL: "__REPO_URL__"
        targetRevision: "__REVISION__"
        path: helm/charts/baedalsak-service
        helm:
          releaseName: '{{.svc}}'
          # 적용 순서 (뒤가 이김). aws-services/ 는 AWS 전용 서비스별 값 (6개 모두 있음 — 없으면 sync 실패로 드러나게)
          valueFiles:
            - ../../values/services/{{.svc}}.yaml
            - ../../values/aws.yaml
            - ../../values/aws-services/{{.svc}}.yaml
            - ../../values/aws-image.yaml
          valuesObject:
            global:
              imageRegistry: "__IMAGE_REGISTRY__"
              imageNamespace: "__IMAGE_NAMESPACE__"
              awsRegion: "__AWS_REGION__"
              externalSecret:
                keyPrefix: "__SECRET_PREFIX__"
                ssmStore: aws-parameter-store
                ssmPrefix: "__SSM_PREFIX__"
              db:
                host: "__RDS_HOST__"
              rabbitmq:
                host: "__MQ_HOST__"
                vhost: "__MQ_VHOST__"
              redisSession:
                host: "__REDIS_HOST__"
            # gateway 만 targetGroupBinding.enabled (aws-services/gateway.yaml) — 다른 서비스에선 쓰이지 않음
            targetGroupBinding:
              targetGroupARN: "__TG_ARN__"
      destination:
        server: https://kubernetes.default.svc
        namespace: "__NAMESPACE__"
      syncPolicy:
        automated:
          prune: true
          selfHeal: false
        # 자동 sync 는 같은 커밋이 실패하면 다음 커밋까지 다시 시도하지 않음 → 매일 새 클러스터에서 ESO Secret ·
        #   LBC webhook 이 준비되기 전에 실패해도 멈추지 않게 재시도 (10s → 20s → 40s → 80s → 160s, 약 5분 — argocd-wait.sh 10분 안)
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  # store: 가게·메뉴 이미지 presigned 업로드 (버킷 이름에 계정 번호가 들어가 Git 에 두지 않음)
  #   valuesObject 는 templatePatch 로 고칠 수 없어(argoproj/argo-cd#22850) helm.parameters(--set) 로 넣음
  #   패치 구조는 6개 모두 같고(빈 패치를 만들지 않게), store 만 목록에 값이 들어감
  templatePatch: |
    spec:
      source:
        helm:
          parameters:
          {{- if eq .svc "store" }}
            - { name: extraEnv.IMAGE_BUCKET, value: "__IMAGE_BUCKET__", forceString: true }
            - { name: extraEnv.IMAGE_BASE_URL, value: "__IMAGE_BASE_URL__", forceString: true }
          {{- else }}
            []
          {{- end }}
