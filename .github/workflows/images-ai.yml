# =============================================================================
# AI 이미지 빌드 → ECR (<PROJECT>-<ENV_NAME>/ai:<AI 커밋 SHA 7자리>) → 태그 커밋 (helm/values/aws-image-ai.yaml)
#   AI 레포(vars.AI_REPO, 기본 SeSac-4/baedalsak-ai)의 Dockerfile 을 linux/amd64 로 빌드
#   실행: AI 레포 develop push → AI 레포 notify-infra.yml 이 repository_dispatch(ai-updated, sha) 로 호출, 또는 수동 실행
#   배포: 태그 커밋을 Argo CD 가 감지 (ApplicationSet 에 ai 가 들어간 뒤부터). 꺼져 있으면 다음 켜기 때
#   서버 이미지(images.yml)와 태그 파일이 달라 서로 영향 없음
# 레포 Variables: AWS_REGION · PROJECT · ENV_NAME · AI_REPO(선택) · AI_REF(선택, 기본 develop)
# 레포 Secrets  : AWS_ROLE_ARN · AI_REPO_TOKEN (AI 레포가 private — fine-grained PAT, baedalsak-ai Contents: Read)
# =============================================================================
name: AI 이미지 빌드 (AI → ECR)

on:
  repository_dispatch:
    types: [ai-updated] # client_payload.sha = AI 레포 커밋
  workflow_dispatch:
    inputs:
      ai_ref:
        description: AI 레포 브랜치·태그·커밋 (비우면 vars.AI_REF 또는 develop)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: images-ai
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT: ${{ vars.PROJECT }}
  ENV_NAME: ${{ vars.ENV_NAME }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AI_REPO: ${{ vars.AI_REPO || 'SeSac-4/baedalsak-ai' }}
  AI_REF: ${{ github.event.client_payload.sha || inputs.ai_ref || vars.AI_REF || 'develop' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: check variables
        env:
          GH_TOKEN: ${{ secrets.AI_REPO_TOKEN }}
          BRANCH: ${{ vars.AI_REF || 'develop' }}
        run: |
          : "${AWS_REGION:?레포 변수 AWS_REGION 이 없습니다}"
          : "${PROJECT:?레포 변수 PROJECT 가 없습니다}"
          : "${ENV_NAME:?레포 변수 ENV_NAME 이 없습니다}"
          : "${AWS_ROLE_ARN:?레포 Secret AWS_ROLE_ARN 이 없습니다}"
          : "${GH_TOKEN:?레포 Secret AI_REPO_TOKEN 이 없습니다 (baedalsak-ai Contents: Read PAT)}"
          # 외부에서 들어오는 값은 커밋 SHA 형식 + AI 레포 기준 브랜치의 커밋만 허용 (images.yml 과 같음)
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            [[ "$AI_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::client_payload.sha 가 커밋 SHA(40자리)가 아닙니다: $AI_REF"; exit 1; }
            ST=$(gh api "repos/$AI_REPO/compare/$AI_REF...$BRANCH" -q .status)
            case "$ST" in ahead|identical) ;; *) echo "::error::$AI_REF 는 $AI_REPO@$BRANCH 의 커밋이 아닙니다 ($ST)"; exit 1 ;; esac
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.AI_REPO }}
          ref: ${{ env.AI_REF }}
          token: ${{ secrets.AI_REPO_TOKEN }}

      - name: Dockerfile 확인
        run: test -f Dockerfile || { echo "::error::$AI_REPO@$AI_REF 에 Dockerfile 이 없습니다"; exit 1; }

      - id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-${{ env.ENV_NAME }}/ai:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "### ai → image_tag **$TAG** ($AI_REPO@$AI_REF)" >> "$GITHUB_STEP_SUMMARY"

  # 태그 커밋 — 파일이 아직 없으면(ApplicationSet 에 ai 를 넣기 전) 건너뜀
  tag:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: commit image tag
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          IMAGE_TAG_FILE: helm/values/aws-image-ai.yaml
        run: |
          if [ ! -f "$IMAGE_TAG_FILE" ]; then
            echo "::warning::$IMAGE_TAG_FILE 이 없어 태그 커밋을 건너뜀 (이미지는 ECR 에 올라감: ai:$IMAGE_TAG)"; exit 0
          fi
          ./scripts/aws/image-tag.sh set "$IMAGE_TAG"
