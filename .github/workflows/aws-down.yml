# AWS 개발 환경 끄기 — 수동 실행 전용 (시간 예약 없음)
#   앱·애드온 삭제 → RDS·Valkey 스냅샷(완료 확인) → ephemeral 스택 삭제 → 스냅샷 최신 7개만 보관
#   ECR·Secrets Manager 등 persistent 스택은 지우지 않음
name: AWS 끄기

# Budgets 일일 예산 초과 시 자동 실행은 꺼 둠 (terraform/persistent budget_auto_down)
on:
  workflow_dispatch:
    inputs:
      task_token:
        description: (자동) Step Functions 작업 토큰 — 수동 실행 시 비워 둠
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

# 켜기가 아직 돌고 있으면 끝날 때까지 기다린 뒤 실행
concurrency:
  group: aws-stack
  cancel-in-progress: false

jobs:
  down:
    uses: ./.github/workflows/aws-stack.yml
    secrets: inherit
    with:
      action: down
      task_token: ${{ inputs.task_token || '' }}
