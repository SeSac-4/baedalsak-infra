# AWS 개발 환경 끄기 — 평일 19:00 KST 자동 + 수동 실행
#   앱·애드온 삭제 → ephemeral 스택 삭제(RDS 최종 스냅샷 생성) → 최종 스냅샷 최신 7개만 보관
#   ECR·Secrets Manager 등 persistent 스택은 지우지 않음
name: AWS 끄기 (평일 19:00)

# 예약: EventBridge Scheduler(평일 19:00 KST) → Step Functions → Lambda ① 이 task_token 과 함께 실행 (terraform/persistent/ops.tf)
#   Budgets 일일 예산 초과 시에도 Lambda ③ → Step Functions 로 실행됨
on:
  workflow_dispatch:
    inputs:
      task_token:
        description: (자동) Step Functions 작업 토큰 — 수동 실행 시 비워 둠
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

# 켜기가 아직 돌고 있으면 끝날 때까지 기다린 뒤 실행
concurrency:
  group: aws-stack
  cancel-in-progress: false

jobs:
  down:
    uses: ./.github/workflows/aws-stack.yml
    with:
      action: down
      task_token: ${{ inputs.task_token || '' }}
