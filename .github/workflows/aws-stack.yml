# =============================================================================
# AWS 스택 공통 본체 — 직접 실행하지 않음. 아래 워크플로가 action 을 넘겨 호출
#   aws-plan.yml       (action=plan)       : 두 스택 plan (변경 미리보기)
#   aws-persistent.yml (action=persistent) : persistent 스택만 apply (ECR·Secrets Manager 등)
#   aws-up.yml         (action=up)         : persistent → ephemeral apply → 애드온 → DB·MQ 초기화 → 앱 배포 → smoke test
#   aws-down.yml       (action=down)       : MQ 큐 비우기 대기 → 앱·애드온 삭제 → RDS·Valkey 스냅샷 → ephemeral destroy → 스냅샷 7개만 보관
#   gitops-check.yml   (action=verify)     : infra develop 의 helm 변경 → 켜져 있으면 deploy.sh(ApplicationSet 재적용·sync 대기) → smoke test (되돌리지 않고 실패 알림만)
#   images.yml         (action=deploy)     : 새 이미지 태그를 helm/values/aws-image.yaml 에 커밋, 클러스터가 켜져 있으면 Argo CD sync 대기 → smoke test
#   앱 배포는 Argo CD(GitOps) — deploy.sh 가 ApplicationSet 을 적용하고 sync 를 기다림. 실패 시 태그 커밋을 git revert
# 동시 실행 방지(concurrency)는 호출하는 쪽에 둠 — 여기에도 같은 group 을 두면 서로 기다리다 멈춤
# 필요한 레포 변수(Settings → Secrets and variables → Actions → Variables): docs/aws-runbook.md 표
#   필수: AWS_REGION · PROJECT · ENV_NAME · AZS · KUBERNETES_VERSION  (+ 레포 Secret: AWS_ROLE_ARN · TF_STATE_BUCKET)
#   필수: DOMAIN_NAME (Route 53 에서 구매한 도메인)
#   선택: BUDGET_DAILY_USD · BUDGET_WARN_USD · COST_REPORT_SENDER · CLUSTER_NAME · SECRET_PREFIX · SSM_PREFIX · OPS_COGNITO_DOMAIN_PREFIX
#   레포 Secret(선택): TEAM_MEMBER_ARNS · ALERT_EMAILS (알림 메일 JSON 배열, 예 ["a@b.com"]) — 공개 로그에 안 남게 Secret 으로 (호출부 secrets: inherit)
#   레포 Secret(선택): OPS_ADMIN_EMAILS · OPS_VIEWER_EMAILS (Grafana 운영자, 쉼표 구분) — 같은 이유로 Secret
# =============================================================================
name: (공통) AWS 스택 실행

on:
  workflow_call:
    inputs:
      action:
        description: plan | persistent | up | down | deploy | verify
        type: string
        required: true
      image_tag:
        description: up 일 때 배포할 이미지 태그 (비우면 ECR gateway 의 최신 태그)
        type: string
        required: false
        default: ""
      task_token:
        description: Step Functions 작업 토큰 (예약 켜기·끄기). 있으면 마지막에 결과를 보고
        type: string
        required: false
        default: ""

# permissions 는 두지 않음 → 호출한 워크플로의 권한을 그대로 받음 (여기서 선언하면 그 이하로만 낮아짐)
#   contents: write 는 이미지 태그 커밋·되돌리기가 있는 images.yml · aws-up.yml 만 줌 (scripts/aws/image-tag.sh)
#   그 밖의 호출(plan · persistent · down)은 id-token: write · contents: read

env:
  # scripts/aws/env.sh 가 읽는 값 (선택 값이 비면 <PROJECT>-<ENV_NAME> 규칙)
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT: ${{ vars.PROJECT }}
  ENV_NAME: ${{ vars.ENV_NAME }}
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || format('{0}-{1}', vars.PROJECT, vars.ENV_NAME) }}
  SECRET_PREFIX: ${{ vars.SECRET_PREFIX }}
  SSM_PREFIX: ${{ vars.SSM_PREFIX }}
  # Argo CD 가 읽고 이미지 태그를 커밋할 브랜치 = 이 워크플로를 실행한 브랜치 (예약·이미지 빌드·변경 확인은 develop)
  #   다른 브랜치로 수동 실행하면 그 브랜치 기준으로 검증 — develop 에는 커밋하지 않음 (scripts/aws/deploy.sh · image-tag.sh)
  GITOPS_REVISION: ${{ github.ref_name }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  # Terraform 변수 (같은 값을 TF_VAR_* 로)
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_project: ${{ vars.PROJECT }}
  TF_VAR_env: ${{ vars.ENV_NAME }}
  TF_VAR_azs: ${{ vars.AZS }}
  TF_VAR_kubernetes_version: ${{ vars.KUBERNETES_VERSION }}
  TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
  TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
  TF_VAR_secret_prefix: ${{ vars.SECRET_PREFIX }}
  TF_VAR_ssm_prefix: ${{ vars.SSM_PREFIX }}
  TF_VAR_team_member_arns: ${{ secrets.TEAM_MEMBER_ARNS || '[]' }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_github_ref: ${{ github.event.repository.default_branch }}
  TF_VAR_budget_daily_usd: ${{ vars.BUDGET_DAILY_USD || '20' }}
  TF_VAR_budget_warn_usd: ${{ vars.BUDGET_WARN_USD || '15' }}
  TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS || '[]' }} # 메일 주소는 Secret (공개 로그 노출 방지)
  TF_VAR_cost_report_sender: ${{ vars.COST_REPORT_SENDER || '' }}
  TF_VAR_ops_cognito_domain_prefix: ${{ vars.OPS_COGNITO_DOMAIN_PREFIX }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # 공개 레포라 로그에 남지 않게 — 작업 토큰(Step Functions)·알림 메일 주소 가림
      #   토큰은 이벤트 파일에서 읽음 (env 로 받으면 이 단계 로그에 먼저 찍힘)
      - name: mask
        env:
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          OPS_EMAILS: ${{ secrets.OPS_ADMIN_EMAILS }},${{ secrets.OPS_VIEWER_EMAILS }}
        run: |
          t="$(jq -r '.inputs.task_token // empty' "$GITHUB_EVENT_PATH")"
          if [ -n "$t" ]; then echo "::add-mask::$t"; fi
          for e in $(echo "${ALERT_EMAILS:-[]}" | jq -r '.[]'); do echo "::add-mask::$e"; done
          for e in ${OPS_EMAILS//,/ }; do echo "::add-mask::$e"; done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check variables
        run: |
          for v in AWS_REGION PROJECT ENV_NAME AWS_ROLE_ARN TF_STATE_BUCKET TF_VAR_azs TF_VAR_kubernetes_version DOMAIN_NAME; do
            if [ -z "${!v}" ]; then echo "::error::레포 변수·Secret 이 없습니다: $v (docs/aws-runbook.md 표 참고)"; exit 1; fi
          done

      # 도구 설치는 AWS 자격 증명을 받기 전에 (설치 액션이 자격 증명을 보지 못하게)
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          mask-aws-account-id: true # 공개 로그에 계정 번호 가림
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      # Secrets Manager 비밀값(비밀번호·토큰·키 — 토스 키·seed 포함)을 이후 모든 로그에서 가림
      #   *_USER 는 프로젝트 이름과 같아 가리면 로그 전체가 *** 가 되므로 제외
      - name: mask secrets
        run: |
          prefix="${SECRET_PREFIX:-$PROJECT/$ENV_NAME}"
          for n in $(aws secretsmanager list-secrets --filters Key=name,Values="$prefix/" --query 'SecretList[].Name' --output text); do
            v="$(aws secretsmanager get-secret-value --secret-id "$n" --query SecretString --output text 2>/dev/null)" || continue
            if echo "$v" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "$v" | jq -r 'to_entries[] | select(.key | test("PASSWORD|SECRET|TOKEN|KEY")) | .value | tostring'
            else
              echo "$v"
            fi | while IFS= read -r s; do if [ -n "$s" ]; then echo "::add-mask::$s"; fi; done
          done

      - name: terraform init
        run: |
          for s in persistent ephemeral; do
            terraform -chdir=terraform/$s init -input=false \
              -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
          done

      # ---------- deploy: 클러스터가 켜져 있을 때만 (꺼져 있으면 다음 "AWS 켜기" 가 최신 이미지를 배포) ----------
      - name: cluster check
        id: cluster
        if: inputs.action == 'deploy' || inputs.action == 'verify'
        run: |
          STATUS=$(aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_REGION" --query cluster.status --output text 2>/dev/null || echo NONE)
          echo "cluster $CLUSTER_NAME: $STATUS"
          if [ "$STATUS" = "ACTIVE" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::클러스터가 꺼져 있어 배포를 건너뜀 — 다음 AWS 켜기 때 최신 이미지로 배포됩니다"
          fi

      # ---------- plan ----------
      - name: plan
        if: inputs.action == 'plan'
        run: |
          terraform -chdir=terraform/persistent plan -input=false
          terraform -chdir=terraform/ephemeral plan -input=false || echo "persistent 를 먼저 apply 해야 ephemeral plan 이 됩니다"

      # ---------- persistent / up ----------
      - name: apply persistent
        if: inputs.action == 'persistent' || inputs.action == 'up'
        run: terraform -chdir=terraform/persistent apply -input=false -auto-approve

      # ECR 저장소가 생긴 직후 — 켤 때마다 확인하므로 deploy.sh 가 Valkey 이미지를 못 찾는 일이 없음 (있으면 건너뜀)
      - name: Valkey 이미지 (Docker Hub → ECR)
        if: inputs.action == 'persistent' || inputs.action == 'up'
        run: ./scripts/aws/valkey-image.sh

      - name: 운영자 Cognito 사용자
        if: inputs.action == 'persistent' || inputs.action == 'up'
        env:
          OPS_ADMIN_EMAILS: ${{ secrets.OPS_ADMIN_EMAILS }}
          OPS_VIEWER_EMAILS: ${{ secrets.OPS_VIEWER_EMAILS }}
        run: ./scripts/aws/ops-users.sh

      # 운영: 최신 최종 스냅샷에서 RDS · Valkey 복원 (terraform/ephemeral/data.tf) — 스냅샷이 없으면(첫 켜기) 빈 상태로 생성
      #   개발 기간 방식(매일 빈 DB)으로 되돌릴 때는 run: terraform -chdir=terraform/ephemeral apply -input=false -auto-approve
      - name: apply ephemeral
        id: apply
        if: inputs.action == 'up'
        run: |
          ARGS=()
          SNAP=$(aws rds describe-db-snapshots --snapshot-type manual \
            --query "reverse(sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier,'${PROJECT}-${ENV_NAME}-final-') && Status=='available'], &SnapshotCreateTime))[0].DBSnapshotIdentifier" \
            --output text)
          if [ -n "$SNAP" ] && [ "$SNAP" != "None" ]; then echo "RDS restore from $SNAP"; ARGS+=(-var "db_snapshot_identifier=$SNAP"); echo "rds_restored=true" >> "$GITHUB_OUTPUT"; fi
          VSNAP=$(aws elasticache describe-snapshots --snapshot-source manual \
            --query "reverse(sort_by(Snapshots[?starts_with(SnapshotName,'${PROJECT}-${ENV_NAME}-valkey-final-') && SnapshotStatus=='available'], &NodeSnapshots[0].SnapshotCreateTime))[0].SnapshotName" \
            --output text)
          if [ -n "$VSNAP" ] && [ "$VSNAP" != "None" ]; then echo "Valkey restore from $VSNAP"; ARGS+=(-var "redis_snapshot_name=$VSNAP"); fi
          terraform -chdir=terraform/ephemeral apply -input=false -auto-approve "${ARGS[@]}"

      - name: kubeconfig
        if: inputs.action == 'up' || inputs.action == 'down' || steps.cluster.outputs.up == 'true'
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" || echo "cluster not found"

      - name: addons
        if: inputs.action == 'up'
        run: ./scripts/aws/addons.sh

      - name: DB·MQ init
        if: inputs.action == 'up'
        run: ./scripts/aws/db-init.sh

      # RDS 를 스냅샷에서 복원했으면 건너뜀 — DB 에 회원이 있는데 Cognito 계정을 지우면 로그인 불가
      #   빈 DB 로 떴을 때만(첫 켜기 · 스냅샷 없음) 실행 — member id 가 1000 부터 다시 시작해 남은 Cognito 사용자와 가입이 겹침
      - name: Cognito 정리 (username 1000 이상, 빈 DB 일 때만)
        if: inputs.action == 'up' && steps.apply.outputs.rds_restored != 'true'
        run: ./scripts/aws/cognito-cleanup.sh

      # 앱 이미지 빌드가 부른 deploy = 6개 빌드 성공 / 수동 켜기에 태그 입력 → 이 태그를 Git 에 커밋 (클러스터가 꺼져 있어도)
      #   helm/values/aws-image.yaml 이 배포 태그의 기준 — 켜져 있으면 Argo CD 가 이 커밋을 감지해 배포, 꺼져 있으면 다음 켜기가 이 태그로 배포
      #   (이전: SSM <SSM_PREFIX>/image_tag 에 기록 — 더 이상 쓰지 않음)
      - name: commit image tag
        if: (inputs.action == 'deploy' || inputs.action == 'up') && inputs.image_tag != ''
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: ./scripts/aws/image-tag.sh set "$IMAGE_TAG"

      # 배포할 태그: 입력이 있으면 그 값(위에서 커밋함), 없으면(예약 실행) 원격 develop 의 helm/values/aws-image.yaml
      - name: image tag
        id: tag
        if: inputs.action == 'up' || steps.cluster.outputs.up == 'true'
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="$IMAGE_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(./scripts/aws/image-tag.sh get || true)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
            echo "::warning::배포할 이미지가 없습니다 — 앱 이미지 빌드 워크플로를 먼저 실행하세요 (인프라만 켬)"
            TAG=""
          fi
          echo "image tag: ${TAG:-없음}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # verify: values·차트 변경은 태그가 그대로라, Argo CD 가 지금 develop 최신 커밋까지 sync 했는지도 기다림 (DEPLOY_REV)
      - name: deploy apps
        id: deploy
        if: (inputs.action == 'up' || steps.cluster.outputs.up == 'true') && steps.tag.outputs.tag != ''
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          VERIFY: ${{ inputs.action == 'verify' }}
        run: |
          if [ "$VERIFY" = "true" ]; then
            DEPLOY_REV="$(git ls-remote origin refs/heads/develop | cut -f1)"
            export DEPLOY_REV
            echo "확인할 develop 커밋: $DEPLOY_REV"
          fi
          ./scripts/aws/deploy.sh "$IMAGE_TAG"

      - name: smoke test
        id: smoke
        if: (inputs.action == 'up' || steps.cluster.outputs.up == 'true') && steps.tag.outputs.tag != ''
        run: ./scripts/aws/smoke-test.sh

      - name: debug on failure
        if: failure() && (inputs.action == 'up' || inputs.action == 'deploy' || inputs.action == 'verify')
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n "$ENV_NAME" get externalsecret,targetgroupbinding || true
          for d in gateway member store order payment delivery; do
            echo "===== $d"; kubectl -n "$ENV_NAME" logs "deploy/$d" --tail=80 || true
          done
          kubectl -n "$ENV_NAME" get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n argocd get applications || true

      # 새 이미지 배포(deploy)·smoke test 실패 → 태그 커밋을 git revert → Argo CD 가 직전 태그로 sync (로그는 위 단계에서 먼저 남김)
      #   켜기(up)는 되돌리지 않음 — 새 클러스터라 되돌릴 직전 배포가 없음 (helm rollback 때도 건너뜀)
      - name: rollback on failure
        if: failure() && inputs.action == 'deploy' && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./scripts/aws/rollback.sh "$IMAGE_TAG"

      # ---------- down ----------
      - name: remove apps and addons
        if: inputs.action == 'down'
        run: ./scripts/aws/down.sh

      # 데이터 보존: 앱이 내려간 뒤(쓰기 없음) 스냅샷을 만들고 완료까지 기다림 — 실패하면 이 단계에서 멈춰 destroy 안 함
      #   이름 규칙 = 켜기의 복원 · 아래 정리 단계가 찾는 접두사 (<PROJECT>-<ENV_NAME>-final- / -valkey-final-)
      #   이미 꺼져 있으면(인스턴스 없음) 건너뜀
      - name: RDS · Valkey 스냅샷 (destroy 전)
        if: inputs.action == 'down'
        run: |
          set -euo pipefail
          NAME="${PROJECT}-${ENV_NAME}"
          TS="$(TZ=Asia/Seoul date +%Y%m%d%H%M)"
          # 둘을 먼저 다 걸고 나서 기다림 (동시 진행 — 순서대로 할 때보다 3~4분 짧음)
          RDS=""; VK=""
          if aws rds describe-db-instances --db-instance-identifier "$NAME" >/dev/null 2>&1; then
            RDS="${NAME}-final-${TS}"
            aws rds create-db-snapshot --db-instance-identifier "$NAME" --db-snapshot-identifier "$RDS" >/dev/null
            echo "RDS 스냅샷 $RDS 시작"
          else echo "RDS 없음 — 건너뜀"; fi
          if aws elasticache describe-replication-groups --replication-group-id "$NAME" >/dev/null 2>&1; then
            VK="${NAME}-valkey-final-${TS}"
            # 클러스터 모드 꺼짐 → 복제 그룹이 아닌 노드(<NAME>-001)로 떠야 함 (InvalidParameterCombination)
            NODE="$(aws elasticache describe-replication-groups --replication-group-id "$NAME" --query 'ReplicationGroups[0].MemberClusters[0]' --output text)"
            aws elasticache create-snapshot --cache-cluster-id "$NODE" --snapshot-name "$VK" >/dev/null
            echo "Valkey 스냅샷 $VK 시작"
          else echo "Valkey 없음 — 건너뜀"; fi
          if [ -n "$RDS" ]; then
            aws rds wait db-snapshot-available --db-snapshot-identifier "$RDS"
            echo "RDS 스냅샷 완료"
          fi
          if [ -n "$VK" ]; then
            for _ in $(seq 1 60); do
              st="$(aws elasticache describe-snapshots --snapshot-name "$VK" --query 'Snapshots[0].SnapshotStatus' --output text)"
              [ "$st" = "available" ] && break
              [ "$st" = "failed" ] && { echo "Valkey 스냅샷 실패"; exit 1; }
              sleep 10
            done
            [ "$st" = "available" ] || { echo "Valkey 스냅샷 10분 초과"; exit 1; }
            echo "Valkey 스냅샷 완료"
          fi

      - name: destroy ephemeral
        if: inputs.action == 'down'
        run: terraform -chdir=terraform/ephemeral destroy -input=false -auto-approve

      # 매일 1개씩 쌓이는 최종 스냅샷을 최신 7개(7일치)만 남김
      - name: RDS 최종 스냅샷 정리 (최신 7개 보관)
        if: inputs.action == 'down'
        env:
          KEEP: 7
        run: |
          mapfile -t OLD < <(aws rds describe-db-snapshots --snapshot-type manual \
            --query "sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier,'${PROJECT}-${ENV_NAME}-final-')], &SnapshotCreateTime)[].DBSnapshotIdentifier" \
            --output text | tr '\t' '\n' | grep . | head -n -"$KEEP")
          for s in "${OLD[@]}"; do echo "delete $s"; aws rds delete-db-snapshot --db-snapshot-identifier "$s" >/dev/null; done
          echo "삭제 ${#OLD[@]}개, 최신 $KEEP 개 보관"

      - name: Valkey 최종 스냅샷 정리 (최신 7개 보관)
        if: inputs.action == 'down'
        env:
          KEEP: 7
        run: |
          mapfile -t OLD < <(aws elasticache describe-snapshots --snapshot-source manual \
            --query "sort_by(Snapshots[?starts_with(SnapshotName,'${PROJECT}-${ENV_NAME}-valkey-final-')], &NodeSnapshots[0].SnapshotCreateTime)[].SnapshotName" \
            --output text | tr '\t' '\n' | grep . | head -n -"$KEEP")
          for s in "${OLD[@]}"; do echo "delete $s"; aws elasticache delete-snapshot --snapshot-name "$s" >/dev/null; done
          echo "삭제 ${#OLD[@]}개, 최신 $KEEP 개 보관"

      # 예약 실행(Scheduler → Step Functions → Lambda ①)이면 결과를 작업 토큰으로 돌려줌 → 메일 알림
      - name: report to Step Functions
        if: always() && inputs.task_token != ''
        env:
          TASK_TOKEN: ${{ inputs.task_token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            aws stepfunctions send-task-success --task-token "$TASK_TOKEN" --task-output "{\"status\":\"success\",\"run\":\"$GITHUB_RUN_ID\"}"
          else
            aws stepfunctions send-task-failure --task-token "$TASK_TOKEN" --error "Workflow${JOB_STATUS^}" --cause "run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
