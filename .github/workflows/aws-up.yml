# AWS 개발 환경 켜기 — 수동 실행 전용 (시간 예약 없음)
#   ephemeral 스택 생성(개발 기간: RDS 는 빈 DB) → 애드온 → DB·MQ 초기화 → 앱 배포 → smoke test
#   약 36분 소요
name: AWS 켜기

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 배포할 이미지 태그 (입력하면 helm/values/aws-image.yaml 에 커밋 후 배포, 비우면 그 파일의 태그)
        required: false
        default: ""
      task_token:
        description: (자동) Step Functions 작업 토큰 — 수동 실행 시 비워 둠
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-stack
  cancel-in-progress: false

jobs:
  # contents: write — 태그를 입력했을 때 helm/values/aws-image.yaml 커밋 (scripts/aws/image-tag.sh)
  up:
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/aws-stack.yml
    secrets: inherit
    with:
      action: up
      image_tag: ${{ inputs.image_tag || '' }}
      task_token: ${{ inputs.task_token || '' }}
