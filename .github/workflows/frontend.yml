# =============================================================================
# 프론트 배포 (클라이언트 레포 → S3 → CloudFront)
#   실행: 클라이언트 레포 develop push → notify-infra.yml 이 repository_dispatch(client-updated, sha) 로 호출
#         또는 수동 실행
#   npm ci → npm run build(dist/) → s3 sync 2회
#     ① assets 등 index.html 외 파일: 1년 캐시(immutable) — 이전 파일은 지우지 않음(열려 있는 화면이 옛 파일을 요청할 수 있음)
#     ② index.html: no-cache — 항상 최신 assets 를 가리킴
#   CloudFront 가 켜져 있으면 /index.html 무효화 (꺼져 있으면 다음 켜기 때 새 배포가 S3 를 바로 읽음)
#   선행: persistent 스택 (S3 프론트 버킷)
# 레포 Variables: AWS_REGION · PROJECT · ENV_NAME · AWS_ROLE_ARN · CLIENT_REPO · CLIENT_REF (선택 SSM_PREFIX)
# =============================================================================
name: 프론트 배포 (클라이언트 → S3)

on:
  repository_dispatch:
    types: [client-updated] # client_payload.sha = 클라이언트 레포 커밋
  workflow_dispatch:
    inputs:
      client_ref:
        description: 클라이언트 레포 브랜치·태그·커밋 (비우면 vars.CLIENT_REF)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  CLIENT_REPO: ${{ vars.CLIENT_REPO }}
  CLIENT_REF: ${{ github.event.client_payload.sha || inputs.client_ref || vars.CLIENT_REF }}
  SSM_PREFIX: ${{ vars.SSM_PREFIX || format('/{0}/{1}', vars.PROJECT, vars.ENV_NAME) }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: check variables
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ vars.CLIENT_REF }}
        run: |
          : "${AWS_REGION:?레포 변수 AWS_REGION 이 없습니다}"
          : "${AWS_ROLE_ARN:?레포 Secret AWS_ROLE_ARN 이 없습니다}"
          : "${CLIENT_REPO:?레포 변수 CLIENT_REPO 가 없습니다}"
          : "${CLIENT_REF:?입력 client_ref 또는 레포 변수 CLIENT_REF 가 필요합니다}"
          # 외부에서 들어오는 값은 클라이언트 레포 CLIENT_REF 브랜치에 있는 커밋 SHA 만 허용
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            [[ "$CLIENT_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::client_payload.sha 가 커밋 SHA(40자리)가 아닙니다"; exit 1; }
            ST=$(gh api "repos/$CLIENT_REPO/compare/$CLIENT_REF...$BRANCH" -q .status)
            case "$ST" in ahead|identical) ;; *) echo "::error::$CLIENT_REF 는 $CLIENT_REPO@$BRANCH 의 커밋이 아닙니다 ($ST)"; exit 1 ;; esac
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ env.CLIENT_REF }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # VITE_* 는 빌드 시점에 들어감 — 클라이언트 .env.example 기본값(/api/v1, 토스 테스트 클라이언트 키) 사용
      - name: build
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          mask-aws-account-id: true # 공개 로그에 계정 번호 가림
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: s3 sync (assets → index.html)
        run: |
          BUCKET=$(aws ssm get-parameter --name "$SSM_PREFIX/front_bucket" --query Parameter.Value --output text)
          aws s3 sync dist/ "s3://$BUCKET/" --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
          echo "### 프론트 배포: \`$CLIENT_REPO@$CLIENT_REF\` → s3://$BUCKET" >> "$GITHUB_STEP_SUMMARY"

      - name: CloudFront 무효화 (켜져 있을 때만)
        run: |
          CF=$(aws ssm get-parameter --name "$SSM_PREFIX/cloudfront_id" --query Parameter.Value --output text 2>/dev/null || true)
          if [ -z "$CF" ]; then echo "::notice::CloudFront 가 꺼져 있음 — 다음 켜기 때 새 파일로 서비스"; exit 0; fi
          aws cloudfront create-invalidation --distribution-id "$CF" --paths /index.html --query Invalidation.Id --output text
