# =============================================================================
# 앱 이미지 빌드 → ECR (<PROJECT>-<ENV_NAME>/<서비스>:<서버 커밋 SHA 7자리>)
#   서버 레포(vars.SERVER_REPO)를 체크아웃해서 서비스 6개를 amd64 로 빌드
#   실행: 서버 레포 develop push → 서버 레포 notify-infra.yml 이 repository_dispatch(server-updated) 로 호출
#         또는 수동 실행
#   빌드가 모두 성공하면 클러스터가 켜져 있을 때 바로 배포(aws-stack action=deploy) → smoke test
#   꺼져 있으면 배포는 건너뛰고, 다음 "AWS 켜기" 가 마지막 빌드를 배포
#   선행: "AWS 상시 리소스 적용" 워크플로 (ECR 저장소 생성)
# 레포 Variables: AWS_REGION · PROJECT · ENV_NAME · AWS_ROLE_ARN · SERVER_REPO · SERVER_REF
# 레포 Secrets  : SERVER_REPO_TOKEN (서버 레포가 private 일 때만 — contents:read 권한 PAT)
# =============================================================================
name: 앱 이미지 빌드 (서버 → ECR)

on:
  repository_dispatch:
    types: [server-updated] # client_payload.sha = 서버 레포 커밋
  workflow_dispatch:
    inputs:
      server_ref:
        description: 서버 레포 브랜치·태그·커밋 (비우면 vars.SERVER_REF)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

# 연속 push 시 순서대로 (진행 중인 배포를 끊지 않음, 대기 중인 것은 최신 1개만 남음)
concurrency:
  group: images
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT: ${{ vars.PROJECT }}
  ENV_NAME: ${{ vars.ENV_NAME }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  SERVER_REPO: ${{ vars.SERVER_REPO }}
  SERVER_REF: ${{ github.event.client_payload.sha || inputs.server_ref || vars.SERVER_REF }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, member, store, order, payment, delivery]
    steps:
      - name: check variables
        env:
          GH_TOKEN: ${{ secrets.SERVER_REPO_TOKEN || github.token }}
          BRANCH: ${{ vars.SERVER_REF }}
        run: |
          : "${AWS_REGION:?레포 변수 AWS_REGION 이 없습니다}"
          : "${PROJECT:?레포 변수 PROJECT 가 없습니다}"
          : "${ENV_NAME:?레포 변수 ENV_NAME 이 없습니다}"
          : "${AWS_ROLE_ARN:?레포 변수 AWS_ROLE_ARN 이 없습니다}"
          : "${SERVER_REPO:?레포 변수 SERVER_REPO 가 없습니다}"
          : "${SERVER_REF:?입력 server_ref 또는 레포 변수 SERVER_REF 가 필요합니다}"
          # 외부에서 들어오는 값은 커밋 SHA 형식만 허용
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] && ! [[ "$SERVER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::client_payload.sha 가 커밋 SHA(40자리)가 아닙니다: $SERVER_REF"; exit 1
          fi
          # 그 커밋이 서버 레포 vars.SERVER_REF 브랜치에 들어 있는지 (포크 커밋 등 차단)
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            ST=$(gh api "repos/$SERVER_REPO/compare/$SERVER_REF...$BRANCH" -q .status)
            case "$ST" in ahead|identical) ;; *) echo "::error::$SERVER_REF 는 $SERVER_REPO@$BRANCH 의 커밋이 아닙니다 ($ST)"; exit 1 ;; esac
          fi

      # public 서버 레포는 기본 토큰, private 이면 secrets.SERVER_REPO_TOKEN
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ env.SERVER_REF }}
          token: ${{ secrets.SERVER_REPO_TOKEN || github.token }}

      - id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          mask-aws-account-id: true # 공개 로그에 계정 번호 가림
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false # 태그 1개 = 매니페스트 1개 (ECR "최신 7개" 수명 주기가 이미지 단위로 세도록)
          build-args: MODULE=${{ matrix.service }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-${{ env.ENV_NAME }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "### $SERVICE → image_tag **$TAG** ($SERVER_REPO@$SERVER_REF)" >> "$GITHUB_STEP_SUMMARY"

  # 6개 모두 성공했을 때만. AWS 켜기·끄기와 겹치지 않게 같은 concurrency group
  deploy:
    needs: build
    concurrency:
      group: aws-stack
      cancel-in-progress: false
    uses: ./.github/workflows/aws-stack.yml
    secrets: inherit
    with:
      action: deploy
      image_tag: ${{ needs.build.outputs.tag }}
