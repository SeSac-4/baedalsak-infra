# =============================================================================
# 앱 이미지 빌드 → ECR (<PROJECT>-<ENV_NAME>/<서비스>:<서버 커밋 SHA 7자리>)
#   서버 레포(vars.SERVER_REPO)를 체크아웃해서 서비스 6개를 amd64 로 빌드
#   끝나면 Summary 에 태그가 나옴 → "AWS 켜기" 의 image_tag 로 사용 (비우면 마지막 빌드를 자동 사용)
#   선행: "AWS 상시 리소스 적용" 워크플로 (ECR 저장소 생성)
# 레포 Variables: AWS_REGION · PROJECT · ENV_NAME · AWS_ROLE_ARN · SERVER_REPO · SERVER_REF
# 레포 Secrets  : SERVER_REPO_TOKEN (서버 레포가 private 일 때만 — contents:read 권한 PAT)
# =============================================================================
name: 앱 이미지 빌드 (서버 → ECR)

on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: 서버 레포 브랜치·태그·커밋 (비우면 vars.SERVER_REF)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT: ${{ vars.PROJECT }}
  ENV_NAME: ${{ vars.ENV_NAME }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  SERVER_REPO: ${{ vars.SERVER_REPO }}
  SERVER_REF: ${{ inputs.server_ref || vars.SERVER_REF }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, member, store, order, payment, delivery]
    steps:
      - name: check variables
        run: |
          : "${AWS_REGION:?레포 변수 AWS_REGION 이 없습니다}"
          : "${PROJECT:?레포 변수 PROJECT 가 없습니다}"
          : "${ENV_NAME:?레포 변수 ENV_NAME 이 없습니다}"
          : "${AWS_ROLE_ARN:?레포 변수 AWS_ROLE_ARN 이 없습니다}"
          : "${SERVER_REPO:?레포 변수 SERVER_REPO 가 없습니다}"
          : "${SERVER_REF:?입력 server_ref 또는 레포 변수 SERVER_REF 가 필요합니다}"

      # public 서버 레포는 기본 토큰, private 이면 secrets.SERVER_REPO_TOKEN
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ env.SERVER_REF }}
          token: ${{ secrets.SERVER_REPO_TOKEN || github.token }}

      - id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: MODULE=${{ matrix.service }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-${{ env.ENV_NAME }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - run: echo "### ${{ matrix.service }} → image_tag **${{ steps.tag.outputs.tag }}** (${{ env.SERVER_REPO }}@${{ env.SERVER_REF }})" >> "$GITHUB_STEP_SUMMARY"
